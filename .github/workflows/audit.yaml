# Scans the declared dependencies for known vulnerabilities and fails if any are
# found. Dependabot (see .github/dependabot.yml) proposes upgrades but does not
# block a merge, so this is what actually gates.

name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an advisory published against an unchanged dependency is still
    # caught. Note GitHub disables scheduled workflows in forked repositories by
    # default, so this may need enabling; the pull_request trigger above is the
    # path that is guaranteed to run.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: python3 -m pip install pip-audit --user

    - name: Audit declared dependencies
      run: python3 -m pip_audit -r requirements.txt -r requirements-dev.txt
