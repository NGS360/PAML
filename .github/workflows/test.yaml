# This workflow runs the unit tests across the supported Python versions.
# Dependencies come from uv.lock, so a failure here reproduces locally.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fail rather than silently re-resolving if uv.lock is out of date.
  UV_FROZEN: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install libcurl4-gnutls-dev libgnutls28-dev

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --frozen --python ${{ matrix.python-version }}

    - name: Test
      run: |
        uv run coverage run --source=src -m pytest -v --log-cli-level=INFO
        uv run coverage report
