name: Publish Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to build a draft release for, e.g. v0.5.3. Use this to
          re-run a release build that failed. Leave empty to validate that the
          package builds without creating a release.
        required: false
        type: string

jobs:
  release:
    name: Build & Publish Release 📦
    runs-on: ubuntu-latest

    # Least privilege: only 'gh release create' needs write access.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        # A manual run builds the tag given as input; a tag push builds itself.
        ref: ${{ inputs.tag || github.ref }}
        # release_notes.py walks the tag list and commit history, neither of
        # which exist in the default shallow clone. Without this the "Commits"
        # section of the release notes only ever contains the version bump.
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Only build and twine are needed here, but requirements-dev.txt supplies
    # their version bounds so the pins live in exactly one place.
    - name: Install build tooling
      run: >-
        python3 -m
        pip install
        build
        twine
        --constraint requirements-dev.txt
        --user

    - name: Build a binary wheel and a source tarball
      run: python3 -m build

    - name: Validate the built artifacts
      run: python3 -m twine check dist/*

    # Resolves to the dispatch input, else the pushed tag, else empty. An empty
    # TAG means this run only validates the build, so no release is created.
    - name: Prepare environment with release version information
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "$INPUT_TAG" ]; then
          TAG="$INPUT_TAG"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        else
          TAG=""
          echo "No tag supplied - validating the build only, no release will be created."
        fi
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV

    - name: Generate release notes
      if: env.TAG != ''
      run: |
        python scripts/release_notes.py > ${{ github.workspace }}-RELEASE_NOTES.md

    - name: Create Release
      if: env.TAG != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create
        --title "$TAG"
        --notes-file ${{ github.workspace }}-RELEASE_NOTES.md
        --draft
        --latest
        --repo ${{ github.repository }}
        "$TAG"
        dist/**
